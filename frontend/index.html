<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vestidor Táctico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#historia">Vestidor Táctico</a>
  <nav class="tabs" id="tabs" aria-label="Secciones">
    <a href="#historia">Historia</a><a href="#almada">Almada</a><a href="#partidos">Partidos</a>
    <a href="#explorador">Explorador</a><a href="#laboratorio">Laboratorio</a><a href="#metodo">Método</a>
  </nav>
  <div class="mode" role="group" aria-label="Nivel de detalle">
    <button type="button" data-mode="aficionado" aria-pressed="true">Aficionado</button>
    <button type="button" data-mode="dt" aria-pressed="false">DT</button>
  </div>
</div></header>
<main id="view" aria-live="polite"></main>
<div id="errors" hidden></div>
<script>
  window.__errors = [];
  const note = (m) => { window.__errors.push(m); document.getElementById('errors').textContent = window.__errors.join(' | '); };
  window.__note = note;
  window.addEventListener('error', (e) => note(String(e.message)));
  window.addEventListener('unhandledrejection', (e) => note(String(e.reason)));
</script>
<script type="module">
import * as fmt from './js/fmt.js';
import * as api from './js/api.js';
import { parseHash, routeFor } from './js/router.js';

const MODE_KEY = 'caon.mode';
const urlMode = new URLSearchParams(location.search).get('modo');
const readMode = () => { if (urlMode === 'dt' || urlMode === 'aficionado') return urlMode; try { return localStorage.getItem(MODE_KEY) === 'dt' ? 'dt' : 'aficionado'; } catch (e) { return 'aficionado'; } };
const saveMode = (m) => { try { localStorage.setItem(MODE_KEY, m); } catch (e) { /* almacenamiento no disponible */ } };
let mode = readMode();

async function renderLab(root, ctx) {
  root.innerHTML = `<section class="view"><header class="vhead"><h2>Laboratorio: prueba estilos y jugadas en el modelo</h2>
    <p>Aquí se simula; nada de esto es un pronóstico. <a href="/lab.html">Abrir el laboratorio en pantalla completa →</a></p></header>
    <div id="playlab"></div>
    <iframe class="labframe" src="/lab.html" title="Laboratorio de simulación" loading="lazy"></iframe></section>`;
  const mod = await import('./views/playlab.js');
  await mod.render(root.querySelector('#playlab'), ctx);
}
async function route() {
  const { name, params } = parseHash(location.hash);
  const r = routeFor(name);
  for (const a of document.querySelectorAll('#tabs a')) {
    const target = a.getAttribute('href').slice(1);
    a.classList.toggle('on', target === name || (name === 'partido' && target === 'partidos') || (name === 'dt' && target === 'explorador') || (name === 'equipo' && target === 'explorador'));
  }
  const root = document.getElementById('view');
  const ctx = { api, fmt, mode, params, navigate: (h) => { location.hash = h; } };
  try {
    if (name === 'laboratorio') await renderLab(root, ctx);
    else await (await import(`./views/${r.view}.js`)).render(root, ctx);
    document.title = `${r.label} · Vestidor Táctico`;
  } catch (e) {
    window.__note(String(e));
    root.innerHTML = '<div class="card"><h3>No pudimos mostrar esta sección</h3><p class="muted">Intenta recargar la página.</p></div>';
  }
}
function paintMode() {
  for (const b of document.querySelectorAll('.mode button')) b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
  document.documentElement.dataset.mode = mode;
}
for (const b of document.querySelectorAll('.mode button')) b.addEventListener('click', () => { mode = b.dataset.mode; saveMode(mode); paintMode(); route(); });
window.addEventListener('hashchange', route);
paintMode(); route();
</script>
</body>
</html>
